name: Docker
description: 컨테이너 실행·로그·네트워크·볼륨·이미지 빌드·Compose. 실습 컨테이너 안에 별도의 Docker 가 돌아서 내 PC 의 Docker 와 섞이지 않아요.
order: 25
icon: 🐳
short: Docker

# 실습 컨테이너 안에서 dockerd 를 돌린다 (Docker-in-Docker)
privileged: true
volumes: [/var/lib/docker]
memory: 1536
cpus: 2
command: [sh, -c, "dockerd > /var/log/dockerd.log 2>&1 & exec sleep infinity"]

