# 환경 정의: 어떤 CLI를 연습하는 공간인지 설명한다.
name: Linux (bash)
description: 우분투 24.04 + bash. 파일·디렉터리, 텍스트 처리, 권한, 프로세스 등 리눅스 기본기.
order: 10
# 아래 값들은 생략하면 기본값이 쓰인다.
shell: [bash, -l]
user: learner
workdir: /home/learner
history: /home/learner/.bash_history
hostname: lab
icon: 🐧
short: Linux

# 시나리오 묶음 (scenario.yaml 의 category 로 연결). 나열 순서대로 보여준다.
categories:
  - id: basics
    name: 파일과 폴더
    icon: 📁
    description: 이동하고, 만들고, 옮기고, 지우기
  - id: text
    name: 텍스트·로그 처리
    icon: 📝
    description: grep, sed, awk, 파이프로 원하는 정보만 뽑기
  - id: storage
    name: 검색·압축·백업
    icon: 💾
    description: find, tar 로 파일 찾고 묶고 되살리기
  - id: permission
    name: 권한과 사용자
    icon: 🔐
    description: chmod, chown, 사용자와 그룹
  - id: shell
    name: 셸과 자동화
    icon: 🧰
    description: PATH, 반복문, cron 으로 셸을 내 편으로
  - id: network
    name: 네트워크·원격 접속
    icon: 🌐
    description: curl, jq, SSH 키
  - id: deploy
    name: 배포 스크립트
    icon: 🚀
    description: "배포 스크립트가 실패할 때: 줄바꿈, set -e, 롤백, cron"
  - id: incident
    name: 장애 대응
    icon: 🚨
    description: CPU, 디스크, 포트, 배포 실패… 실제 장애 상황 해결
