# 환경 정의: 어떤 CLI를 연습하는 공간인지 설명한다.
name: Linux (bash)
description: 우분투 24.04 + bash. 파일·디렉터리, 텍스트 처리, 권한, 프로세스 등 리눅스 기본기.
order: 10
# 아래 값들은 생략하면 기본값이 쓰인다.
shell: [bash, -l]
user: learner
workdir: /home/learner
history: /home/learner/.bash_history
hostname: lab
icon: 🐧

# 시나리오 묶음 (scenario.yaml 의 category 로 연결). 나열 순서대로 보여준다.
categories:
  - id: basics
    name: 파일과 폴더
    icon: 📁
    description: 이동하고, 만들고, 옮기고, 지우기
  - id: text
    name: 텍스트·로그 처리
    icon: 📝
    description: grep, sed, awk, 파이프로 원하는 정보만 뽑기
  - id: storage
    name: 검색·디스크·백업
    icon: 💾
    description: find, du, tar 로 파일 찾고 공간 정리하기
  - id: permission
    name: 권한과 사용자
    icon: 🔐
    description: chmod, chown, 사용자와 그룹
  - id: process
    name: 프로세스·자동화
    icon: ⚙️
    description: ps, kill, cron 으로 돌아가는 것 다루기
  - id: network
    name: 네트워크·API
    icon: 🌐
    description: 포트, curl, jq 로 서비스 상태 확인하기
  - id: shell
    name: 셸 다루기
    icon: 🧰
    description: PATH, 변수, 반복문으로 셸을 내 편으로
