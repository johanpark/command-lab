title: 실험 계정에 안전 펜스 치기 (Organizations SCP)
category: security
level: 3
minutes: 30
tags: [organizations create-policy, attach-policy, SERVICE_CONTROL_POLICY, aws:RequestedRegion, NotAction, ec2:InstanceType, FullAWSAccess]
summary: 실험용 Sandbox 계정에서 누가 버지니아 리전에 GPU 서버를 켜 두고 퇴근했다. 서울 밖 리전과 GPU 인스턴스를 막는 SCP 를 만들어 Sandbox OU 에만 건다. 전역 서비스와 운영 계정은 막지 않는다.
