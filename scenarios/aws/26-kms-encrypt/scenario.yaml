title: 결제 설정 파일 암호화하고 키 관리하기 (KMS)
category: security
level: 2
minutes: 25
tags: [kms create-key, create-alias, enable-key-rotation, encrypt, decrypt, fileb://, schedule-key-deletion]
summary: 서버에 평문으로 놓인 결제 설정 파일을 KMS 키로 암호화한다. 결제 전용 키와 별칭을 만들고 자동 교체를 켠 뒤, 파일을 암호화하고 평문은 지운다. 더 이상 안 쓰는 테스트 키는 바로 지우지 않고 삭제 예약을 건다.
