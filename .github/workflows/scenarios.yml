# 시나리오를 실제 Docker 환경에서 자동 검증한다:
# 풀기 전엔 채점 실패 → 모범 풀이(solution.*) 실행 → 채점 통과 → 함정(traps/)은 기대한 이유로 실패
#   PR: 바뀐 것만, 환경별로 나눠 병렬로 / develop·main push, 매일 밤, 수동 실행: 전체
name: scenarios

on:
  pull_request:
  push:
    branches: [develop, main]
  schedule:
    - cron: '23 17 * * *'   # 매일 한국 시간 02:23
  workflow_dispatch:

concurrency:
  group: scenarios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 구조 검사
        run: node bin/lab.js validate
      - name: 테스트할 시나리오 고르기
        id: plan
        run: node .github/scripts/plan.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  scenarios:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    name: scenarios (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 환경 이미지 빌드
        run: node bin/lab.js build ${{ matrix.env }}
      - name: 시나리오 검증
        run: node bin/lab.js test ${{ matrix.targets }} --verbose
        env:
          CMDLAB_HOME: ${{ runner.temp }}/cmdlab

  # 브랜치 보호의 필수 체크 이름(test)을 그대로 쓰기 위한 집계 단계
  test:
    needs: [plan, scenarios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 결과 모으기
        run: |
          echo "plan: ${{ needs.plan.result }} / scenarios: ${{ needs.scenarios.result }}"
          [ "${{ needs.plan.result }}" = success ] || exit 1
          case "${{ needs.scenarios.result }}" in success|skipped) ;; *) exit 1 ;; esac
