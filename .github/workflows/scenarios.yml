# 모든 시나리오를 실제 Docker 환경에서 자동 검증한다:
# 풀기 전엔 채점 실패 → 모범 풀이(solution.*) 실행 → 채점 통과
name: scenarios

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CMDLAB_HOME: ${{ runner.temp }}/cmdlab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 구조 검사
        run: node bin/lab.js validate
      - name: 환경 이미지 빌드
        run: node bin/lab.js build --all
      - name: 시나리오 검증
        run: node bin/lab.js test --verbose
